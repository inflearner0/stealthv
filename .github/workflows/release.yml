name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.0"
        required: true

jobs:
  release:
    name: build and publish
    runs-on: windows-2022
    permissions:
      contents: write        # needed to create the release

    steps:
      - uses: actions/checkout@v4

      - name: Install the WDK
        shell: pwsh
        run: choco install windowsdriverkit11 --no-progress -y

      - name: Build and test-sign
        shell: pwsh
        run: .\build.ps1 -Sign

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
                   "${{ github.event.inputs.tag }}"
                 } else {
                   "${{ github.ref_name }}"
                 }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $stage = "stage\stealthv-$tag"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item bin\svmhv.sys, bin\svmhvctl.exe, bin\hvtest.exe,
                    bin\svmhv-test.cer $stage
          Copy-Item mcp\svmhv_agent.py $stage
          Copy-Item README.md, LICENSE $stage
          Copy-Item mcp\README.md "$stage\MCP.md"

          # The certificate in here is generated fresh by every build and is
          # worth exactly nothing as a trust anchor - say so where somebody
          # about to install it will read it.
          @"
          stealthv $tag

          These binaries are TEST-SIGNED with a certificate generated during this
          build. That certificate is not a trust anchor and proves nothing about
          who built this; it exists only so Windows will load the driver on a
          machine with testsigning enabled. Verify the build yourself from source
          if that matters to you.

          To load: enable testsigning, import svmhv-test.cer into both Root and
          TrustedPublisher, and make sure no other hypervisor owns SVM
          (hypervisorlaunchtype off, VBS/HVCI disabled). This puts your running
          kernel inside a hypervisor and can install invisible kernel hooks. Use
          a VM you own.

          See README.md, and MCP.md for the MCP server.
          "@ | Out-File "$stage\RELEASE.txt" -Encoding utf8

          Compress-Archive -Path "$stage\*" -DestinationPath "stealthv-$tag.zip"
          Get-FileHash "stealthv-$tag.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  stealthv-$tag.zip" } |
            Out-File "stealthv-$tag.zip.sha256" -Encoding utf8

          Get-Content "stealthv-$tag.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: stealthv ${{ steps.package.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.package.outputs.tag, '-') }}
          body: |
            A minimal AMD-V hypervisor with nested-paging hooks.

            **Test-signed only.** The certificate in the archive is generated by
            this build and is not a trust anchor. Enable testsigning and import
            it into `Root` and `TrustedPublisher` to load the driver.

            This puts the running kernel inside a hypervisor and can install
            kernel hooks that are invisible to anything reading memory. Run it on
            a machine you own.

            Long-duration stability under load is **not** verified — see *What is
            and is not tested* in the README before relying on it.
          files: |
            stealthv-*.zip
            stealthv-*.zip.sha256
