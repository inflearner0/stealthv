name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.0"
        required: true

jobs:
  release:
    name: build and publish
    runs-on: windows-2022
    permissions:
      contents: write        # needed to create the release

    steps:
      - uses: actions/checkout@v4

      - name: Install the WDK
        shell: pwsh
        run: choco install windowsdriverkit11 --no-progress -y

      - name: Build and test-sign
        shell: pwsh
        run: .\build.ps1 -Sign

      - name: Build and test-sign the manual-map flavour
        shell: pwsh
        # svmhv-manualmap.sys: the same driver with STEALTHV_MANUAL_MAP=1,
        # which makes the entry point ignore both of its parameters. It is
        # signed for symmetry rather than for need - a mapper never asks - so
        # the two artefacts differ only in the constant they were built with.
        run: .\build.ps1 -ManualMap -Sign

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
                   "${{ github.event.inputs.tag }}"
                 } else {
                   "${{ github.ref_name }}"
                 }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $stage = "stage\stealthv-$tag"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item bin\svmhv.sys, bin\svmhv-manualmap.sys, bin\svmhvctl.exe,
                    bin\hvtest.exe, bin\svmhv-test.cer $stage
          Copy-Item mcp\svmhv_agent.py $stage
          Copy-Item README.md, LICENSE $stage
          Copy-Item mcp\README.md "$stage\MCP.md"

          # A fatal-exit RIP is only useful when it can be symbolized against the
          # exact binary that produced it, and the two used to ship apart - which
          # meant the archive somebody actually downloaded was the one that could
          # not answer the question the driver exists to answer. They travel
          # together now, in symbols\ inside the one archive, and the build
          # manifest records the source and ABI identity alongside them.
          $symbols = "$stage\symbols"
          New-Item -ItemType Directory -Path $symbols -Force | Out-Null
          Copy-Item bin\svmhv.pdb, bin\svmhv-manualmap.pdb, bin\svmhvctl.pdb,
                    bin\hvtest.pdb $symbols

          $abiLine = Select-String -Path include\svmhvctl.h `
              -Pattern '^#define\s+SVMHV_CONTROL_VERSION\s+(\d+)' |
              Select-Object -First 1
          if (-not $abiLine) { throw 'could not determine SVMHV_CONTROL_VERSION' }
          $abiVersion = $abiLine.Matches[0].Groups[1].Value
          $commit = (git rev-parse HEAD).Trim()
          $manifest = [ordered]@{
            tag = $tag
            commit = $commit
            control_abi_version = $abiVersion
            files = @()
          }
          foreach ($file in @(
              'bin\svmhv.sys', 'bin\svmhv-manualmap.sys',
              'bin\svmhvctl.exe', 'bin\hvtest.exe',
              'bin\svmhv.pdb', 'bin\svmhv-manualmap.pdb',
              'bin\svmhvctl.pdb', 'bin\hvtest.pdb')) {
            $hash = Get-FileHash $file -Algorithm SHA256
            $manifest.files += [ordered]@{
              name = [IO.Path]::GetFileName($file)
              sha256 = $hash.Hash
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File "$stage\BUILD-MANIFEST.json" -Encoding utf8

          # The certificate in here is generated fresh by every build and is
          # worth exactly nothing as a trust anchor - say so where somebody
          # about to install it will read it.
          @"
          stealthv $tag

          These binaries are TEST-SIGNED with a certificate generated during this
          build. That certificate is not a trust anchor and proves nothing about
          who built this; it exists only so Windows will load the driver on a
          machine with testsigning enabled. Verify the build yourself from source
          if that matters to you.

          To load: enable testsigning, import svmhv-test.cer into both Root and
          TrustedPublisher, and make sure no other hypervisor owns SVM
          (hypervisorlaunchtype off, VBS/HVCI disabled). This puts your running
          kernel inside a hypervisor and can install invisible kernel hooks. Use
          a VM you own.

          Two drivers, one source, one compile-time constant apart:

            svmhv.sys
                Load it as a service. It registers an unload routine, so
                "sc stop" devirtualises and cleans up.

            svmhv-manualmap.sys
                Built with STEALTHV_MANUAL_MAP=1. The entry point ignores both
                parameters, so a mapper may call it with NULL, with its own base
                and size, or with anything else. There is no unload routine in
                this one and nothing could call it if there were: the way out is
                a reboot. Kernel SEH also depends on your mapper inserting the
                image into the loader's function table - if it does not, the
                __try blocks in here are decoration.

          Do not manual-map svmhv.sys. It writes DriverUnload through the
          pointer it was handed, and a mapper does not have to hand it one.

          symbols\ holds the PDBs for everything above. Keep them with the lab
          evidence: a fatal-exit RIP means nothing without the binary it came
          from, and BUILD-MANIFEST.json says which build that is.

          See README.md, and MCP.md for the MCP server.
          "@ | Out-File "$stage\RELEASE.txt" -Encoding utf8

          Compress-Archive -Path "$stage\*" -DestinationPath "stealthv-$tag.zip"
          Get-FileHash "stealthv-$tag.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  stealthv-$tag.zip" } |
            Out-File "stealthv-$tag.zip.sha256" -Encoding utf8

          Get-Content "stealthv-$tag.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: stealthv ${{ steps.package.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.package.outputs.tag, '-') }}
          body: |
            A minimal AMD-V hypervisor with nested-paging hooks.

            **Test-signed only.** The certificate in the archive is generated by
            this build and is not a trust anchor. Enable testsigning and import
            it into `Root` and `TrustedPublisher` to load the driver.

            This puts the running kernel inside a hypervisor and can install
            kernel hooks that are invisible to anything reading memory. Run it on
            a machine you own.

            Two builds of the same driver: `svmhv.sys` to load as a service,
            and `svmhv-manualmap.sys` for a manual mapper — the second ignores
            both of the parameters its entry point is handed and has no unload
            routine, so the only way out of it is a reboot. Do not manual-map
            `svmhv.sys`; it writes `DriverUnload` through a pointer a mapper
            need not have given it. `RELEASE.txt` in the archive has the rest.

            One archive, with the PDBs in `symbols/` inside it and a
            `BUILD-MANIFEST.json` giving the source commit, control ABI version
            and SHA-256 of every binary. Keep the lot together: a fatal RIP or a
            trace is only readable against the exact build that produced it.

            Long-duration stability under load is **not** verified — see *What is
            and is not tested* in the README before relying on it.
          files: |
            stealthv-*.zip
            stealthv-*.zip.sha256
