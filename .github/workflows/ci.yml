name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A commit is "valid" here if the driver and both tools compile clean with /WX,
# the layout assertions still hold, and the agent's own tests pass. Nothing runs
# the hypervisor: that needs an AMD host with SVM and a VM to be a guest, which
# no hosted runner has. See the release job for what actually ships.
jobs:
  build:
    name: build driver and tools
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install the WDK
        shell: pwsh
        run: |
          # The runner ships the SDK but not the driver kit, and the driver
          # needs km\ headers and ntoskrnl.lib.
          choco install windowsdriverkit11 --no-progress -y
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $versions = Get-ChildItem "$kit\Include" -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'km') }
          if (-not $versions) { throw "the WDK did not install any km\ headers" }
          Write-Host "WDK versions with km headers: $($versions.Name -join ', ')"

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Check what came out
        shell: pwsh
        run: |
          # /WX means a warning already failed the step; this is about the
          # artefacts existing and being the right shape.
          $expected = 'bin\svmhv.sys', 'bin\svmhvctl.exe', 'bin\hvtest.exe'
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "missing: $file" }
          }
          Get-ChildItem $expected | Select-Object Name, Length | Format-Table -AutoSize

          $driver = Get-Item 'bin\svmhv.sys'
          if ($driver.Length -lt 20kb) { throw "svmhv.sys is suspiciously small" }

      - name: Exercise the non-loaded control probe
        shell: pwsh
        run: |
          # Hosted runners cannot load the driver, but this is still a useful
          # end-to-end check of the x64 assembly stub and its #UD recovery path.
          # A non-loaded hypervisor is the expected condition and must report it
          # cleanly instead of terminating the helper.
          $output = & .\bin\svmhvctl.exe present 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          # -match against an array filters it rather than answering yes or no,
          # and the explanatory line on stderr is one of the elements. Join it
          # into a single string so this is the boolean it looks like.
          $text = ($output | ForEach-Object { $_.ToString() }) -join "`n"
          if ($exitCode -ne 1 -or $text -notmatch 'present=0') {
            throw "svmhvctl present did not report a clean non-loaded state " +
                  "(exit $exitCode, output: $text)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: stealthv-build
          path: |
            bin/svmhv.sys
            bin/svmhvctl.exe
            bin/hvtest.exe
          if-no-files-found: error

  agent:
    name: mcp agent tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests, without keystone or capstone
        # The agent runs on the standard library alone, and this is that path:
        # what a guest with no pip gets, using the built-in assembler and
        # decoder. It is only exercised if something selects it deliberately.
        env:
          SVMHV_NO_ENGINES: "1"
        run: python mcp/test_agent.py

      - name: Install the optional engines
        # Optional to the agent, but this is the path the lab guest actually
        # uses, so it has to be tested too - the two disagree about encodings
        # and about what they will refuse.
        run: python -m pip install --disable-pip-version-check capstone keystone-engine

      - name: Tests, with keystone and capstone
        run: python mcp/test_agent.py

      - name: Compile check every script
        run: python -m compileall -q mcp/

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Nothing built or secret is committed
        run: |
          set -e
          # bin/ is ignored, but an ignore file only helps if nobody forces past
          # it, and a committed signing certificate would be worse than noise.
          if git ls-files | grep -Ei '\.(sys|exe|obj|pdb|cer|pfx|ilk)$'; then
            echo "::error::build output or a certificate is committed"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)bin/'; then
            echo "::error::bin/ is committed"
            exit 1
          fi
          echo "clean"

      - name: The license is present
        run: test -f LICENSE && head -1 LICENSE
